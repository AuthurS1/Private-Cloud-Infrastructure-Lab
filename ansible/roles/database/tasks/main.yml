---
# tasks file for database
- name: Install PostgreSQL packages
  ansible.builtin.apt:
    name: "{{ postgresql_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
- name: Ensure PostgreSQL is enabled and running
  ansible.builtin.service:
    name: "{{ postgresql_service }}"
    state: started
    enabled: true
- name: Wait for PostgreSQL to accept connections
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 5432
    timeout: 30
- name: Create PostgreSQL application user
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ postgresql_app_user }}"
    password: "{{ postgresql_app_password }}"
    role_attr_flags: "LOGIN,NOSUPERUSER,NOCREATEDB,NOCREATEROLE"
    state: present
  environment:
    PGOPTIONS: "-c password_encryption=scram-sha-256"
  no_log: true

- name: Create PostgreSQL application database
  become_user: postgres
  community.postgresql.postgresql_db:
    name: "{{ postgresql_database_name }}"
    owner: "{{ postgresql_app_user }}"
    encoding: "{{ postgresql_database_encoding }}"
    state: present
- name: Verify PostgreSQL application database
  become_user: postgres
  community.postgresql.postgresql_query:
    login_db: postgres
    query: >
      SELECT
        datname,
        pg_catalog.pg_get_userbyid(datdba) AS owner
      FROM pg_database
      WHERE datname = %s
    positional_args:
      - "{{ postgresql_database_name }}"
  register: postgresql_database_check
  changed_when: false
- name: Display PostgreSQL database information
  ansible.builtin.debug:
    var: postgresql_database_check,query_result

