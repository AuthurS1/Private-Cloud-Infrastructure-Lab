---
# tasks file for webserver
- name: Install Nginx
  ansible.builtin.apt:
    name: "{{ webserver_package }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
- name: Create web document root
  ansible.builtin.file:
    path: "{{ webserver_document_root }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"
- name: Deploy web homepage
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ webserver_document_root }}/index.html"
    owner: www-data
    group: www-data
    mode: "0644"
    backup: true
  notify: Reload nginx
- name: Deploy Nginx virtual host
  ansible.builtin.template:
    src: nginx-site.conf.j2
    dest: "/etc/nginx/sites-available/{{ webserver_site_name }}.conf"
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload nginx
- name: Enable Nginx virtual host
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ webserver_site_name }}.conf"
    dest: "/etc/nginx/sites-enabled/{{ webserver_site_name }}.conf"
    state: link
    force: true
  notify: Reload nginx
- name: Disable default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx
- name: Validate Nginx configuration
  ansible.builtin.command:
    cmd: nginx -t
  register: nginx_config_test
  changed_when: false
- name: Ensure Nginx is enabled and running
  ansible.builtin.service:
    name: "{{ webserver_service }}"
    state: started
    enabled: true

