name: Server Monitor CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source
      uses: actions/checkout@v4


    - name: Setup Python
      uses: action/setup-python@v5
      with:
        python-version: "3.12"


    - name: Install Python Packages
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt


    - name: Python Syntax Check
      run: |
        python -m py_compile app.py


    - name: Validate Docker Compose
      run: |
        docker compose config


    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3


    - name: Validate Kubernetes Files
      run: |
        grep "apiVersion" k8s/deployment.yaml
        grep "kind" k8s/deployment.yaml
        grep "apiVersion" k8s/service.yaml
        grep "kind" k8s/service.yaml

    - name: CI Success
      run: echo "Build Success!"

