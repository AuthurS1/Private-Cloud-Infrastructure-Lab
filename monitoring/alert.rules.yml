groups:
- name: ServerMonitoring
  rules:
  - alert: HighCPUUsage
    expr: 100 - (avg by(instance)(irate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 80
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: High CPU Usage
      description: CPU usage > 80% on {{ $labels.instance }}

